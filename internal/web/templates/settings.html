{{define "title"}}Settings – gitvoice{{end}}
{{define "content"}}
<h1>Settings</h1>

{{if .Saved}}<div class="success">Settings saved.</div>{{end}}

<form method="post" action="/settings">
  <fieldset>
    <legend>Your company</legend>
    <p class="hint">Printed on every invoice as the issuer.</p>
    <div class="grid">
      <label>Name <input name="name" value="{{.Company.Name}}"></label>
      <label>Email <input type="email" name="email" value="{{.Company.Email}}"></label>
      <label>Phone <input name="phone" value="{{.Company.Phone}}"></label>
    </div>
    <label>Address <textarea name="address" rows="3">{{.Company.Address}}</textarea></label>
  </fieldset>

  <fieldset>
    <legend>Tax</legend>
    <div class="grid">
      <label>Tax number (Steuernummer) <input name="tax_number" value="{{.Company.TaxNumber}}"></label>
      <label>VAT ID (USt-IdNr.) <input name="vat_id" value="{{.Company.VATID}}"></label>
    </div>
    <label class="check">
      <input type="checkbox" name="small_business" {{if .Company.SmallBusiness}}checked{{end}}>
      Kleinunternehmerregelung (§ 19 UStG) — new invoices default to no VAT
    </label>
    <label>Note printed on small-business invoices
      <input name="small_business_note" value="{{.Company.SmallBusinessNote}}">
    </label>
  </fieldset>

  <fieldset>
    <legend>Bank account</legend>
    <div class="grid">
      <label>IBAN <input name="iban" value="{{.Company.IBAN}}"></label>
      <label>BIC <input name="bic" value="{{.Company.BIC}}"></label>
      <label>Bank <input name="bank_name" value="{{.Company.BankName}}"></label>
    </div>
  </fieldset>

  <div class="actions">
    <button class="button primary" type="submit">Save</button>
    <a href="/">Cancel</a>
  </div>
</form>
{{end}}
