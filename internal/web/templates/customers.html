{{define "title"}}Customers – gitvoice{{end}}
{{define "content"}}
<div class="actions">
  <h1>Customers</h1>
  <span class="spacer"></span>
  <a class="button" href="/customers/new">New customer</a>
</div>
{{if .Customers}}
<table>
  <thead>
    <tr><th>ID</th><th>Company</th><th>Name</th><th>Email</th><th></th></tr>
  </thead>
  <tbody>
    {{range .Customers}}
    <tr>
      <td><a href="/customers/{{.ID}}/edit">{{.ID}}</a></td>
      <td>{{.Company}}</td>
      <td>{{.PersonName}}</td>
      <td>{{.Email}}</td>
      <td class="num">
        <form method="post" action="/customers/{{.ID}}/delete"
              onsubmit="return confirm('Delete customer {{.DisplayName}}? Existing invoices keep their copy of the data.')">
          <button class="button danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p class="empty">No customers yet. <a href="/customers/new">Create the first one.</a></p>
{{end}}
{{end}}
