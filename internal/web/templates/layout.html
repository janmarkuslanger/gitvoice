{{define "layout"}}<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}gitvoice{{end}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar no-print">
  <a class="brand" href="/">gitvoice</a>
  <nav>
    <a href="/customers">{{t .Lang "nav.customers"}}</a>
    <a href="/settings">{{t .Lang "nav.settings"}}</a>
    <a class="button" href="/invoices/new">{{t .Lang "nav.new_invoice"}}</a>
    <span class="lang-switch">
      <a href="/lang/de?back={{.Path}}"{{if eq .Lang "de"}} class="active"{{end}}>DE</a><a href="/lang/en?back={{.Path}}"{{if eq .Lang "en"}} class="active"{{end}}>EN</a>
    </span>
  </nav>
</header>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>{{end}}
